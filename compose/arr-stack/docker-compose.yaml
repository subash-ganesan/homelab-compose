      - "traefik.enable=true"
      - "traefik.http.routers.dispatcharr-rtr.rule=Host(`dispatcharr.0040300.xyz`)"
      - "traefik.http.routers.dispatcharr-rtr.tls=true"
      - "traefik.http.services.dispatcharr-rtr.loadbalancer.server.port=9191"
      - "traefik.http.routers.dispatcharr-rtr.entrypoints=websecure"
      - "traefik.http.routers.dispatcharr-rtr.tls.certresolver=cloudflare"
      - "traefik.http.routers.dispatcharr-rtr.tls.domains[0].main=0040300.xyz"
      - "traefik.http.routers.dispatcharr-rtr.tls.domains[0].sans=*.0040300.xyz"
      - "homepage.group=Tools"
      - "homepage.name=dispatcharr"
      - "homepage.icon=dispatcharr.png"
      - "homepage.href=http://dispatcharr.0040300.xyz/"
      - "homepage.description=dispatcharr for IPTV streaming"
      - "homepage.siteMonitor=http://dispatcharr:9191"
    volumes:
      - ${DOCKER_HOME}/dispatcharr:/data
    environment:
      - TZ=${TIMEZONE}
      - DISPATCHARR_ENV=aio
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      # - LIBVA_DRIVER_NAME=iHD

      # Process Priority Configuration (Optional)
      # Lower values = higher priority. Range: -20 (highest) to 19 (lowest)
      # Negative values require cap_add: SYS_NICE (uncomment below)
      #- UWSGI_NICE_LEVEL=-5   # uWSGI/FFmpeg/Streaming (default: 0, recommended: -5 for high priority)
      #- CELERY_NICE_LEVEL=5   # Celery/EPG/Background tasks (default: 5, low priority)
    #
    # Uncomment to enable high priority for streaming (required if UWSGI_NICE_LEVEL < 0)
    #cap_add:
    #  - SYS_NICE
    # Optional for hardware acceleration
    devices:
     - /dev/dri:/dev/dri  # For Intel/AMD GPU acceleration (VA-API)
    # Uncomment the following lines for NVIDIA GPU support
    # NVidia GPU support (requires NVIDIA Container Toolkit)
    #deploy:
    #  resources:
    #      reservations:
    #          devices:
    #              - driver: nvidia
    #                count: all
    #                capabilities: [gpu]
    <<: *function



