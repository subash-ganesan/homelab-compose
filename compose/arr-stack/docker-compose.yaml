  cross-seed:
    image: ghcr.io/cross-seed/cross-seed:6.13.6
    container_name: cross-seed
    user: 1000:1000 # this must match your torrent client (cross-seed does not support using PGID and PUID)
    # ports:
    #   - "2468:2468"
    environment:
      - TZ=${TIMEZONE}
    volumes:
        - ${DOCKER_HOME}/cross-seed:/config                  # config.js contains radarr sonarr API keys that must be rotated 
        - ${DOCKER_HOME}/cross-seed/cross-seeds:/cross-seeds
        - ${HDD_1_B_HOME}/storage/torrents:/data/torrents
       # You will need at least one extra volume for your media drive if using https://www.cross-seed.org/docs/tutorials/linking
    labels:
      - "homepage.group=Tools"
      - "homepage.name=cross-seed"
      - "homepage.icon=cross-seed.png"
      - "homepage.description=Cross-seed Torrents to Private Trackers"
    command: daemon
    depends_on:
      - qbittorrent
    <<: *function

