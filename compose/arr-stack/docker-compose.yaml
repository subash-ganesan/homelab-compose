      - "traefik.enable=true"
      - "traefik.http.routers.cleanuperr-rtr.rule=Host(`cleanuperr.0040300.xyz`)"
      - "traefik.http.routers.cleanuperr-rtr.tls=true"
      - "traefik.http.services.cleanuperr-rtr.loadbalancer.server.port=11011"
