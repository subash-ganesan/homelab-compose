x-function: &function
  networks:
    - home_net
  restart: unless-stopped
  profiles: ["entertainment"]

x-environment: &environment
  PUID: 1000
  PGID: 1000
  TZ: ${TIMEZONE}

services:
  jellyfin:
    container_name: jellyfin
    image: ghcr.io/jellyfin/jellyfin:10.11.5
    #security_opt: # Required for Docker versions below 20.10.10, update Docker for long term solution. Source: https://docs.linuxserver.io/faq#jammy
    #  - seccomp=unconfined
    environment:
      <<: *environment
    volumes:
      - ${DOCKER_HOME}/jellyfin:/config
      - ${HDD_1_B_HOME}/storage/media:/data/media
      - ${HDD_1_A_HOME}/xtream-download-manager:/data/xtream-download-manager
      - ${HDD_2_B_HOME}/PC_desktop:/data/PC_desktop
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 8096:8096          # unable to make client jellyfin app connect with domain so exposed http://192.168.0.11:8096
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin-rtr.rule=Host(`jellyfin.0040300.xyz`)"
      - "traefik.http.routers.jellyfin-rtr.tls=true"
      - "traefik.http.services.jellyfin-rtr.loadbalancer.server.port=8096"
      - "traefik.http.routers.jellyfin-rtr.entrypoints=websecure"
      - "traefik.http.routers.jellyfin-rtr.tls.certresolver=cloudflare"
      - "traefik.http.routers.jellyfin-rtr.tls.domains[0].main=0040300.xyz"
      - "traefik.http.routers.jellyfin-rtr.tls.domains[0].sans=*.0040300.xyz"
      - "homepage.group=Media"
      - "homepage.name=Jellyfin"
      - "homepage.icon=jellyfin.png"
      - "homepage.href=http://jellyfin.0040300.xyz/"
      - "homepage.description=Media server"
      - "homepage.siteMonitor=http://jellyfin:8096"
    <<: *function

  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: 1000:1000
    environment:
      TZ: ${TIMEZONE}
      # Optional: put your config options customization here. Examples:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
    volumes:
      - ${DOCKER_HOME}/navidrome:/data
      - ${ROOT_HOME}/music:/music:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome-rtr.rule=Host(`navidrome.0040300.xyz`)"
      - "traefik.http.routers.navidrome-rtr.tls=true"
      - "traefik.http.services.navidrome-rtr.loadbalancer.server.port=4533"
      - "traefik.http.routers.navidrome-rtr.entrypoints=websecure"
      - "traefik.http.routers.navidrome-rtr.tls.certresolver=cloudflare"
      - "traefik.http.routers.navidrome-rtr.tls.domains[0].main=0040300.xyz"
      - "traefik.http.routers.navidrome-rtr.tls.domains[0].sans=*.0040300.xyz"
      - "homepage.group=Media"
      - "homepage.name=navidrome"
      - "homepage.icon=navidrome.png"
      - "homepage.href=http://navidrome.0040300.xyz/"
      - "homepage.description=Personal Music Collection"
      - "homepage.siteMonitor=http://navidrome:4533"
    <<: *function

  # jellyseerr:           # https://github.com/fallenbagel/jellyseerr/issues/1195
  #   image: fallenbagel/jellyseerr:2.7.3
