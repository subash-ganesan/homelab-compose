  #   <<: *function


  seerr:
    image: ghcr.io/seerr-team/seerr:v3.1.0
    init: true
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TIMEZONE}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr-rtr.rule=Host(`seerr.0040300.xyz`)"
      - "traefik.http.routers.seerr-rtr.tls=true"
      - "traefik.http.services.seerr-rtr.loadbalancer.server.port=5055"
      - "traefik.http.routers.seerr-rtr.entrypoints=websecure"
      - "traefik.http.routers.seerr-rtr.tls.certresolver=cloudflare"
      - "traefik.http.routers.seerr-rtr.tls.domains[0].main=0040300.xyz"
      - "traefik.http.routers.seerr-rtr.tls.domains[0].sans=*.0040300.xyz"
      - "homepage.group=Tools"
      - "homepage.name=seerr"
      - "homepage.icon=seerr.png"
      - "homepage.href=http://seerr.0040300.xyz/"
      - "homepage.description=Request manager for sonar/radar"
      - "homepage.siteMonitor=http://seerr:5055"
    volumes:
      - ${DOCKER_HOME}/seerr:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    <<: *function


  listsync:
    image: ghcr.io/woahai321/list-sync:0.6.5
    container_name: listsync
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.listsync-rtr.rule=Host(`listsync.0040300.xyz`)"
      - "traefik.http.routers.listsync-rtr.tls=true"
      - "traefik.http.services.listsync-rtr.loadbalancer.server.port=3222"
      - "traefik.http.routers.listsync-rtr.entrypoints=websecure"
      - "traefik.http.routers.listsync-rtr.tls.certresolver=cloudflare"
      - "traefik.http.routers.listsync-rtr.tls.domains[0].main=0040300.xyz"
      - "traefik.http.routers.listsync-rtr.tls.domains[0].sans=*.0040300.xyz"
      - "homepage.group=Tools"
      - "homepage.name=listsync"
      - "homepage.icon=listsync.png"
      - "homepage.description=Import lists into jellyseerr "
      - "homepage.href=http://listsync.0040300.xyz/"
      - "homepage.siteMonitor=http://listsync:3222"
    # ports:
    #   # Frontend (Nuxt 3 Dashboard)
    #   - "3222:3222"
    #   # Backend API (FastAPI)
    #   - "4222:4222"
    environment:         # envs not getting set through ENV. you have to manually change in the UI
      - TZ=${TIMEZONE}
      - "OVERSEERR_URL=http://seerr:5055"
      - "OVERSEERR_API_KEY=${OVERSEERR_API_KEY}"
      - "OVERSEERR_USER_ID=3"
      #- OVERSEERR_USER_ID=${OVERSEERR_USER_ID:-1}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-1}
      - RUNNING_IN_DOCKER=true
      - AUTOMATED_MODE=true
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID}          # trakt client secret not needed
      - OVERSEERR_4K=${OVERSEERR_4K:-false}
      - "IMDB_LISTS=${IMDB_LISTS}"
      #- TRAKT_LISTS=${TRAKT_LISTS}
      #- "LETTERBOXD_LISTS=${LETTERBOXD_LISTS}"
    volumes:
      - ${DOCKER_HOME}/listsync:/usr/src/app/data
    depends_on:
      - seerr
    <<: *function

