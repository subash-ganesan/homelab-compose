  #     - "traefik.http.services.jellyseerr-rtr.loadbalancer.server.port=5055"
  #     - "traefik.http.routers.jellyseerr-rtr.entrypoints=websecure"
  #     - "traefik.http.routers.jellyseerr-rtr.tls.certresolver=cloudflare"
  #     - "traefik.http.routers.jellyseerr-rtr.tls.domains[0].main=0040300.xyz"
  #     - "traefik.http.routers.jellyseerr-rtr.tls.domains[0].sans=*.0040300.xyz"
  #     - "homepage.group=Tools"
  #     - "homepage.name=jellyseerr"
  #     - "homepage.icon=jellyseerr.png"
  #     - "homepage.href=http://jellyseerr.0040300.xyz/"
  #     - "homepage.description=Request manager for sonar/radar"
