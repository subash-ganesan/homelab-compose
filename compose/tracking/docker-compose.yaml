
x-function: &function
  networks:
    - home_net
  restart: unless-stopped
  profiles: ["tracking"]

x-environment: &environment
  PUID: 1000
  PGID: 1000
  TZ: ${TIMEZONE}



services:
  pricebuddy:
    image: jez500/pricebuddy:latest
    # ports:
    #     - 8080:80
    volumes:
        - ${DOCKER_HOME}/pricebuddy/app:/app/storage
        # - ./.env:/app/.env
    environment:
        DB_HOST: pricebuddy-database                       # Name of the database service
        DB_USERNAME: pricebuddy                 # Should match the MYSQL_USER in the database service
        DB_PASSWORD: pric3buddy                 # Should match the MYSQL_PASSWORD in the database service
        DB_DATABASE: pricebuddy                 # Should match the MYSQL_DATABASE in the database service
        APP_USER_EMAIL: admin@example.com       # Only used for seeding the database
        APP_USER_PASSWORD: admin                # Only used for seeding the database
        SCRAPER_BASE_URL: http://pricebuddy-scraper:3000   # Url to Name of the scrapper service
        AFFILIATE_ENABLED: 'true'               # See https://pricebuddy.jez.me/support-project.html
        APP_URL: 'https://pricebuddy.0040300.xyz'
        ASSET_URL: 'https://pricebuddy.0040300.xyz'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pricebuddy-rtr.rule=Host(`pricebuddy.0040300.xyz`)"
      - "traefik.http.routers.pricebuddy-rtr.tls=true"
      - "traefik.http.services.pricebuddy-rtr.loadbalancer.server.port=80"
      - "traefik.http.routers.pricebuddy-rtr.entrypoints=websecure"
      - "traefik.http.routers.pricebuddy-rtr.tls.certresolver=cloudflare"
      - "traefik.http.routers.pricebuddy-rtr.tls.domains[0].main=0040300.xyz"
      - "traefik.http.routers.pricebuddy-rtr.tls.domains[0].sans=*.0040300.xyz"
      - "homepage.group=Tools"
      - "homepage.name=pricebuddy"
      - "homepage.icon=pricebuddy.png"
      - "homepage.href=http://pricebuddy.0040300.xyz/"
      - "homepage.description=Online Price Tracker"
      - "homepage.siteMonitor=http://pricebuddy:80"
    depends_on:
        pricebuddy-database:
            condition: service_healthy
    <<: *function

  pricebuddy-database:
    image: mysql:8.2
    environment:
        MYSQL_DATABASE: pricebuddy
        MYSQL_USER: pricebuddy
        MYSQL_PASSWORD: pric3buddy
        MYSQL_ROOT_PASSWORD: root
    volumes:
        - ${DOCKER_HOME}/pricebuddy/database:/var/lib/mysql
    healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 1m
    <<: *function

  pricebuddy-scraper:
    image: jez500/seleniumbase-scrapper:latest
    # ports:
    #     - 3030:3000 # Optional, if you want to access the scrapper api from the host machine
    <<: *function

